<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCore | Iniciar sesión</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <main class="pagina-formulario">
        <form action="#" method="post">
            <h1>Iniciar sesión</h1>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresá tu contraseña" required>
            <button type="submit">Ingresar</button>
            <p>¿No tenés cuenta? <a href="./registro.html">Registrate</a></p>
            <a class="volver" href="../index.html">Volver al inicio</a>
        </form>
    </main>
</body>
</html>
