<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCore | Registro</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <main class="pagina-formulario">
        <form action="#" method="post">
            <h1>Crear cuenta</h1>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento" required>
            <button type="submit">Registrarse</button>
            <p>¿Ya tenés cuenta? <a href="./login.html">Iniciar sesión</a></p>
            <a class="volver" href="../index.html">Volver al inicio</a>
        </form>
    </main>
</body>
</html>
